<!DOCTYPE html>
<html lang="sl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e293b">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Miselni izzivi</title>

  <meta name="description"
    content="Kognitivne igre za vadbo spomina, hitrosti in pozornosti. Treniraj svoje možgane z interaktivnimi izzivi!">

  <meta property="og:title" content="Miselni izzivi">
  <meta property="og:description" content="Kognitivne igre za vadbo spomina, hitrosti in pozornosti.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://miselni-izzivi.si/">
  <meta property="og:image" content="./icons/icon-512.png">


  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/form.css">
  <link rel="stylesheet" href="./css/games.bundle.css">

</head>

<body>
  <a href="#app-container" class="skip-link">Preskoči na vsebino</a>
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn" id="btn-back" style="display: none; visibility: hidden;" title="Nazaj"
        aria-label="Nazaj">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <div class="header-center" id="header-center">
      <h1 class="logo">Miselni <span class="text-primary">Izzivi</span></h1>
    </div>

    <div class="header-right">
      <div class="header-gamification" id="header-gamification"
        style="display:flex; gap:6px; align-items:center; margin-right:4px; font-size:0.82rem;" aria-live="polite"
        aria-atomic="true">
        <span class="streak-badge" title="Niz dni" style="padding:3px 8px; font-size:0.78rem;">🔥 <span
            id="g-streak">0</span></span>
        <span class="level-badge" title="Nivo" style="padding:3px 8px; font-size:0.78rem;">⭐ <span
            id="g-level">1</span></span>
      </div>
      <button class="icon-btn" id="btn-sound-toggle" title="Preklop zvoka (Vklop/Izklop)" aria-label="Preklop zvoka">
        <svg id="sound-icon-svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path class="sound-wave" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>

      <button class="icon-btn" id="btn-menu" title="Meni" aria-label="Meni" aria-controls="main-nav"
        aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <nav class="main-nav" id="main-nav" role="navigation" aria-label="Glavni meni">
    <div class="nav-drawer-header">
      <span class="nav-drawer-title">Meni</span>
      <button class="nav-drawer-close" id="btn-nav-close" aria-label="Zapri meni">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div class="nav-items">
      <button class="btn-nav" data-target="stats">
        <span class="nav-item-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
        </span>
        Statistika
      </button>
      <button class="btn-nav" data-target="achievements">
        <span class="nav-item-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 6L9 17l-5-5"></path>
          </svg>
        </span>
        Dosežki
      </button>
      <button class="btn-nav" data-target="settings">
        <span class="nav-item-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </span>
        Nastavitve
      </button>
    </div>

    <div class="nav-sound-toggle" id="nav-sound-row">
      <div class="nav-sound-label">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
        <span id="nav-sound-text">Zvočni učinki</span>
      </div>
      <button class="nav-sound-btn" id="btn-sound-toggle-nav" type="button" role="switch" aria-checked="false"
        aria-label="Preklop zvoka">
        <span class="nav-sound-track">
          <span class="nav-sound-thumb"></span>
        </span>
      </button>
    </div>
  </nav>

  <main id="app-container" class="app-container">
    <div class="loading-state">Nalagam module...</div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
